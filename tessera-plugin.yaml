# WireGuard in the top bar: a green shield while the screen's WireGuard tunnel is up, a red one while it is down.
# Every field is explained in docs/MANIFEST.md of github.com/MaxGramser/tessera-plugins.
id: wireguard_bar
version: 0.2.1
api: "0.9"
icon: shield-lock
maintainer: Nekromonger
license: MIT
stage: beta
topics: [tech]
requires:
  esphome: 2026.6.2
boards: any
flash_kb: 2

bar_items:
  - { id: tunnel, label: bar_tunnel, icon: shield-lock, example: bar_example }
  - { id: signal, label: bar_signal, icon: wifi, example: bar_signal_example }
